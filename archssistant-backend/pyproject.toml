[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archssistant-backend"
version = "0.1.0"
description = "FastAPI backend for Archssistant"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "pydantic==2.6.4",
    "pydantic-settings==2.1.0",
    "colorlog==6.8.0",
]

